{% extends "base.html" %}
{% block title %}Page Not Found (404) — AI Mail App{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 80px auto; padding: 0 20px; text-align: center;">
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 48px 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
    <div style="font-size: 3.5rem; margin-bottom: 16px;">🔍</div>
    <h1 style="font-size: 2.2rem; color: #fff; margin-bottom: 8px;">404 - Page Not Found</h1>
    <p style="color: var(--muted); font-size: 1rem; line-height: 1.6; margin-bottom: 24px;">
      The email or page you are looking for does not exist or has been moved.
    </p>
    <a href="{{ url_for('mail.inbox') }}" class="btn btn-primary" style="display: inline-block; width: auto; padding: 12px 28px;">
      ← Return to Inbox
    </a>
  </div>
</div>
{% endblock %}
