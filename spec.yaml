# AI_Mail_App — Project Specification File
# =========================================
# READ THIS FILE FIRST if the project was interrupted.
# This file tracks every phase, what was done, what's next.

project:
  name: AI_Mail_App
  description: >
    A Python Flask web application that uses a locally-running Ollama LLM
    to help users read, compose, summarise, and reply to emails — all
    offline, free, and with no API key required.
  github: https://github.com/ADITHYANWUU2/AI_Mail_App
  python_version: "3.12.3"
  local_llm: Ollama (llama3.2:1b or phi3:mini)
  stack:
    - Flask 3.0.3
    - Flask-Login 0.6.3
    - Werkzeug 3.0.3
    - Requests 2.32.3
    - Ollama (local, no API key)
  cost: ZERO — fully offline after setup, no credit card needed

# ─────────────────────────────────────────────────────────────────────────────
# PHASES
# ─────────────────────────────────────────────────────────────────────────────

phases:

  # ──────────────────────────────────────────────────────────────────────────
  - id: phase_1
    name: "Project Setup & GitHub Init"
    status: DONE               # NOT_STARTED | IN_PROGRESS | DONE
    goal: >
      Create the project folder, virtual environment, requirements.txt,
      .gitignore, spec file, explain Ollama install, and push to GitHub.
    files_created:
      - requirements.txt
      - .gitignore
      - spec.yaml              # this file
      - README.md
      - app/__init__.py        # Flask app factory (skeleton)
      - app/routes/__init__.py
      - run.py
    github_commit: "Phase 1: Project setup - venv, Flask skeleton, spec file"
    next_action: >
      User must: (1) install Git, (2) install Ollama, (3) run pip install,
      (4) push to GitHub using commands listed in README.md.
    completed_steps:
      - Created AI_Mail_App/ directory
      - Created venv with python -m venv venv
      - Created requirements.txt (flask, flask-login, werkzeug, requests)
      - Created .gitignore
      - Created spec.yaml (this file)
    pending_steps:
      - Install Git for Windows (user action)
      - Run: venv\Scripts\activate
      - Run: pip install -r requirements.txt
      - git init, git remote add, git push
      - Install Ollama (user action)
      - Pull model: ollama pull llama3.2:1b

  # ──────────────────────────────────────────────────────────────────────────
  - id: phase_2
    name: "User Authentication (Login / Register / Logout)"
    status: DONE
    goal: >
      Build Flask-Login based auth: register, login, logout routes,
      SQLite user database via Werkzeug password hashing, and base HTML templates.
    files_to_create:
      - app/models/user.py
      - app/routes/auth.py
      - app/templates/base.html
      - app/templates/login.html
      - app/templates/register.html
      - app/static/css/style.css
      - instance/config.py
    github_commit: "Phase 2: User auth - login, register, logout with Flask-Login"

  # ──────────────────────────────────────────────────────────────────────────
  - id: phase_3
    name: "Mail Inbox UI & Full Webmail Client"
    status: DONE
    goal: >
      Build complete email workflow: Compose, Inbox, Sent, Drafts, Trash,
      Email detail view with mark-as-read, delete to trash, restore, and delete forever.
      Extended features: Reply (prefill sender & quoted body), Forward (prefill fwd body),
      Full-text Search (by subject & body), File Attachments (upload & download).
    files_created:
      - database.py (enhanced with email CRUD, unread counts, soft-delete, attachments, search)
      - app/routes/mail.py (compose, inbox, sent, drafts, trash, reply, forward, search, download)
      - app/templates/mail_layout.html (with search bar & live unread badge)
      - app/templates/inbox.html
      - app/templates/mail_list.html (Sent, Drafts, Trash, Search results, attachment indicator)
      - app/templates/compose.html (with file attachment input)
      - app/templates/email_detail.html (with reply, forward, attachment download box)
      - app/static/css/style.css (complete email client theme)
      - uploads/ (secure storage directory for uploaded files)

  # ──────────────────────────────────────────────────────────────────────────
  - id: phase_4
    name: "Google Gemini AI Integration (Summarise / Reply / Compose / Tone / Subject)"
    status: DONE
    goal: >
      Connect to Google Gemini API (generateContent endpoint) using GEMINI_API_KEY from .env.
      Features: summarise email, generate reply, compose new email from prompt, tone adjustment, subject generation.
    files_created:
      - ai/ai_helper.py (Google Gemini REST client with python-dotenv & robust error handling)
      - .env.example and .env (API key configuration)
      - ai/__init__.py & app/ai/ai_helper.py
      - app/templates/test_ai.html (/test-ai route & interactive prompt runner)
      - app/routes/mail.py (/summarize, /smart-reply, /compose/ai-draft, /compose/rewrite-tone, /compose/generate-subject)
      - app/templates/email_detail.html (✨ Summarize Email and 💬 Smart Reply buttons)
      - app/templates/compose.html (✨ AI Draft Assistant, Tone toolbar, Generate Subject)
      - app/static/css/style.css (tone buttons, badges, status indicators, responsive design)

  # ──────────────────────────────────────────────────────────────────────────
  - id: phase_5
    name: "Polish, Error Handling & Final Verification"
    status: DONE
    goal: >
      Add flash messages, error pages (404/500), loading spinners for AI calls,
      responsive CSS, and complete end-to-end test verification.
    files_created:
      - app/templates/404.html (custom 404 page)
      - app/templates/500.html (custom 500 error page)
      - app/__init__.py (registered 404 & 500 error handlers)
      - app/static/css/style.css (responsive mobile breakpoints & media queries)
      - scratch/test_full_suite.py (automated 10-suite end-to-end verification)

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO RESUME (if project was interrupted)
# ─────────────────────────────────────────────────────────────────────────────
resume_instructions: >
  1. Read this spec.yaml file.
  2. Find the first phase with status NOT_STARTED or IN_PROGRESS.
  3. Check 'completed_steps' to know what already exists.
  4. Continue from 'pending_steps' or 'files_to_create'.
  5. After completing a phase, update its status to DONE and push to GitHub.
